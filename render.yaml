databases:
  - name: poketest-db
    databaseName: poketest
    user: poketest
    plan: free
    region: singapore

services:
  - type: web
    name: poketest
    runtime: python
    plan: free
    region: singapore
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: poketest-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
